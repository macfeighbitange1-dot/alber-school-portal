{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-6">
            <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-2xl font-bold text-green-600">Ksh</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Fee Payment</h2>
            <p class="text-gray-500 text-sm">Alber School Kutus M-Pesa Portal</p>
        </div>

        <form hx-post="/payments/stk-push" 
              hx-target="#payment-status" 
              hx-indicator="#pay-loading"
              class="space-y-4">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Parent Phone (254...)</label>
                <input type="number" name="phone" placeholder="254712345678" required
                       class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-green-500 outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Amount (Ksh)</label>
                <input type="number" name="amount" placeholder="e.g. 5000" required
                       class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-green-500 outline-none transition">
            </div>

            <button type="submit" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-lg flex items-center justify-center">
                Send M-Pesa Prompt
            </button>
        </form>

        <div id="pay-loading" class="htmx-indicator mt-4 text-center text-green-600 font-medium">
            Processing... Check your phone for the PIN prompt.
        </div>

        <div id="payment-status" class="mt-6 text-center"></div>
    </div>
</div>
{% endblock %}
