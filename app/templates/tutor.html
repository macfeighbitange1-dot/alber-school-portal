<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <title>Alber AI Tutor</title>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-3xl mx-auto py-12 px-4">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-[#003366]">Alber School AI Tutor</h1>
            <p class="text-gray-600">Ask me anything about your CBC lessons!</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100">
            <form hx-post="/api/ai-tutor" hx-target="#ai-response" hx-indicator="#loading">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Your Question:</label>
                <textarea 
                    name="student_query" 
                    rows="3" 
                    class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#FFD700] outline-none"
                    placeholder="e.g. How does the water cycle work in Mt. Kenya?"></textarea>
                
                <button type="submit" class="mt-4 w-full bg-[#003366] text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition-all">
                    Ask Teacher
                </button>
            </form>

            <div id="loading" class="htmx-indicator mt-4 text-center text-blue-600 font-medium animate-pulse">
                Teacher is thinking...
            </div>

            <div id="ai-response"></div>
        </div>
    </div>
</body>
</html>
