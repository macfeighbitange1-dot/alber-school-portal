<{%% extends "layout.html" %%}>
<{%% block content %%}>
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
    <h2 class="text-3xl font-black text-blue-900 mb-6 text-center">School Login</h2>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Username</label>
            <input type="text" name="username" class="w-full p-3 border-2 border-gray-100 rounded-xl focus:border-blue-500 outline-none" required>
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
            <input type="password" name="password" class="w-full p-3 border-2 border-gray-100 rounded-xl focus:border-blue-500 outline-none" required>
        </div>
        <button type="submit" class="w-full bg-blue-900 text-white font-bold py-3 rounded-xl hover:bg-black transition">Login</button>
    </form>
</div>
<{%% endblock %%}>
