<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Admitted Students</h1>
            <a href="/admission" class="text-blue-600 font-medium">+ Add New Student</a>
        </div>
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Grade</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Parent Phone</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for student in students %}
                    <tr>
                        <td class="px-6 py-4 font-medium">{{ student.full_name }}</td>
                        <td class="px-6 py-4 text-gray-600">Grade {{ student.cbc_grade }}</td>
                        <td class="px-6 py-4 text-gray-600">{{ student.parent_phone }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
